# Local dev services: Postgres with pgvector + Redis for BullMQ.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deck
      POSTGRES_PASSWORD: deck
      POSTGRES_DB: research_to_deck
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
volumes:
  pgdata:
